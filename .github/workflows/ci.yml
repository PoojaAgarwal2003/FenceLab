name: Verify FenceLab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test -count=1 ./...
        env:
          FENCELAB_CLUSTER_EVIDENCE: ${{ runner.temp }}/cluster-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: replicated-execution-${{ matrix.os }}
          path: ${{ runner.temp }}/cluster-evidence.json
          retention-days: 7
      - run: go vet ./...
      - run: go build ./...
      - name: Race detection
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Seeded regression exploration
        run: go run ./cmd/fencelab check -start-seed 0 -seeds 1000
      - name: Transport and counterexample replay
        shell: bash
        run: |
          go run ./cmd/fencelab network -file examples/barrier.json
          go run ./cmd/fencelab search -file examples/eager.json -witness counterexample.json
          go run ./cmd/fencelab replay -file counterexample.json
          go run ./cmd/fencelab search -file examples/barrier.json
      - name: Real process crash and bridge experiments
        shell: bash
        run: |
          go run ./cmd/fencelab durability -dir crash-lab > crash-report.json
          go run ./cmd/fencelab bridge -replay docs/evidence/v2-counterexample.json -dir process-lab > process-report.json
      - name: Declared measured scheduler workloads
        shell: bash
        run: |
          for workload in balanced overload retry-storm priority; do
            go run ./cmd/fencelab workload -file "examples/workload-$workload.json" -dir "workload-$workload" > "workload-$workload-report.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: measured-workloads-${{ matrix.os }}
          path: workload-*-report.json
          retention-days: 7

  containers:
    name: Linux reference deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare isolated credentials
        run: sh deploy/prepare.sh
      - name: Build and exercise persisted execution
        shell: bash
        run: |
          set -euo pipefail
          dc() { docker compose --env-file deploy/.env -f deploy/compose.json "$@"; }
          client() { dc run --rm admin cluster-client -credentials /credentials -endpoints https://node1:8100,https://node2:8100,https://node3:8100 "$@"; }
          dc config --quiet
          dc build
          dc up -d --wait --wait-timeout 90
          client -operation enqueue -file /job.json
          completed=0
          for attempt in $(seq 1 30); do
            result=$(client -operation status -key invoice-2026-001)
            if printf '%s' "$result" | python3 -c 'import json,sys; j=json.load(sys.stdin)["job"]; sys.exit(0 if j["status"]=="completed" else 1)'; then
              completed=1
              break
            fi
            sleep 1
          done
          test "$completed" = 1
          dc down
          dc up -d --wait --wait-timeout 90
          client -operation status -key invoice-2026-001 | python3 -c 'import hashlib,json,sys; j=json.load(sys.stdin)["job"]; assert j["status"]=="completed" and j["result"]==hashlib.sha256(j["payload"].encode()).hexdigest()'
      - name: Container logs
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.json logs --no-color --tail 200
      - name: Stop owned deployment
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.json down

  browser:
    name: Chromium / desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: web-test-results/
          retention-days: 7
